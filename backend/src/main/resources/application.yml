server:
  port: ${PORT:8080}

spring:
  application:
    name: cybercrime-analytics-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cybercrime_analytics?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-very-long-production-value-64-bytes-minimum}
    access-token-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}
  ml:
    base-url: ${ML_SERVICE_URL:http://localhost:5001}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.cybercrimeanalytics: INFO
