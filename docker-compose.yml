services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cybercrime_analytics
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    ports:
      - "5001:5001"

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cybercrime_analytics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: replace-this-compose-secret-with-a-64-character-production-secret-value
      ML_SERVICE_URL: http://ml-service:5001
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
